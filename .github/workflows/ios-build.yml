name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build SwiftUI Snippets
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Project
        run: |
          xcodebuild build \
            -project "SwiftUI-Snippets.xcodeproj" \
            -scheme "SwiftUI-Snippets" \
            -destination "platform=iOS Simulator,name=iPhone 15 Pro,OS=latest" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
